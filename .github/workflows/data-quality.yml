name: Data quality

on:
  pull_request:
    paths:
      - "data/raw/**"
      - "scripts/**"
      - "sources/**"
      - "lib/types.ts"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "data/raw/**"
      - "scripts/**"
      - "sources/**"
      - "lib/types.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data:build
      - run: npm run report:quality
      - run: npm run reports:compact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: row-level-qa-reports
          path: data/reports/ci-artifacts/
          if-no-files-found: error
          retention-days: 14
