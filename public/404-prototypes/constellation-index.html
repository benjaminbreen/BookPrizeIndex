<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 - No Fixed Star</title>
  <style>
    :root {
      --paper: #f4efe6;
      --ink: #141412;
      --muted: #686158;
      --line: #d4cab8;
      --panel: rgba(255, 251, 242, 0.72);
      --accent: #3f6f72;
      --red: #9b3f2f;
      --gold: #b89a4f;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% 42%, rgba(63, 111, 114, 0.12), transparent 30rem),
        linear-gradient(120deg, rgba(20, 20, 18, 0.03), transparent 44%),
        var(--paper);
      color: var(--ink);
      overflow: hidden;
    }

    main {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: clamp(1rem, 3vw, 3rem);
      isolation: isolate;
    }

    .sky {
      position: absolute;
      inset: 0;
      z-index: -2;
      overflow: hidden;
    }

    .orbit {
      position: absolute;
      left: 50%;
      top: 50%;
      border: 1px solid rgba(20, 20, 18, 0.12);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .orbit.one {
      width: min(84vw, 52rem);
      aspect-ratio: 1;
      animation: turn 42s linear infinite;
    }

    .orbit.two {
      width: min(66vw, 38rem);
      aspect-ratio: 1;
      animation: turn 34s linear infinite reverse;
    }

    .orbit.three {
      width: min(42vw, 26rem);
      aspect-ratio: 1;
      animation: turn 28s linear infinite;
    }

    .star {
      position: absolute;
      display: grid;
      width: 2.35rem;
      height: 2.35rem;
      place-items: center;
      border: 1px solid rgba(20, 20, 18, 0.18);
      border-radius: 50%;
      background: var(--panel);
      box-shadow: 0 10px 26px rgba(20, 20, 18, 0.08);
      color: var(--muted);
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 0.68rem;
    }

    .orbit.one .star {
      left: 8%;
      top: 21%;
    }

    .orbit.two .star {
      right: 5%;
      top: 50%;
    }

    .orbit.three .star {
      left: 42%;
      bottom: -1.1rem;
    }

    .line {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(72vw, 46rem);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(20, 20, 18, 0.18), transparent);
      transform-origin: center;
      animation: sweep 9s ease-in-out infinite;
    }

    .line:nth-child(2) {
      animation-delay: -3s;
      transform: translate(-50%, -50%) rotate(62deg);
    }

    .line:nth-child(3) {
      animation-delay: -6s;
      transform: translate(-50%, -50%) rotate(128deg);
    }

    .panel {
      width: min(100%, 52rem);
      border: 1px solid color-mix(in srgb, var(--ink) 14%, var(--line));
      border-radius: 4px;
      background:
        linear-gradient(180deg, rgba(255, 251, 242, 0.88), rgba(255, 251, 242, 0.7)),
        var(--panel);
      box-shadow: 0 24px 80px rgba(20, 20, 18, 0.13);
      backdrop-filter: blur(18px);
      animation: rise 720ms cubic-bezier(0.2, 0.72, 0.18, 1) both;
    }

    .mast {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid var(--line);
      padding: 0.95rem 1rem;
      font-family: "Courier New", ui-monospace, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .pulse {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      letter-spacing: 0.12em;
    }

    .pulse::before {
      content: "";
      width: 0.58rem;
      height: 0.58rem;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 0 rgba(155, 63, 47, 0.38);
      animation: pulse 2s ease-out infinite;
    }

    .body {
      display: grid;
      grid-template-columns: 0.58fr 1fr;
      gap: clamp(1.25rem, 5vw, 3rem);
      align-items: center;
      padding: clamp(1.2rem, 3.2vw, 2.5rem);
    }

    .code {
      position: relative;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(6rem, 15vw, 11rem);
      font-weight: 400;
      letter-spacing: -0.08em;
      line-height: 0.72;
    }

    .code::after {
      content: "";
      position: absolute;
      left: 0.25rem;
      right: 0.15rem;
      top: 54%;
      height: 2px;
      background: var(--red);
      transform: scaleX(0);
      transform-origin: left;
      animation: strike 1.1s 480ms cubic-bezier(0.2, 0.72, 0.18, 1) forwards;
    }

    .message {
      max-width: 24rem;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 4.4vw, 4rem);
      font-weight: 400;
      line-height: 0.98;
      letter-spacing: -0.03em;
    }

    p {
      margin: 1.1rem 0 0;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.7;
    }

    .mini-map {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      margin-top: 1.65rem;
      border: 1px solid var(--line);
      background: var(--line);
    }

    .cell {
      min-height: 2.6rem;
      background: rgba(255, 251, 242, 0.76);
      transition: background 220ms ease, transform 220ms ease;
    }

    .cell:nth-child(6),
    .cell:nth-child(11) {
      background: color-mix(in srgb, var(--accent) 18%, var(--paper));
      animation: cell 2.8s ease-in-out infinite;
    }

    .cell:nth-child(9) {
      background: color-mix(in srgb, var(--red) 16%, var(--paper));
      animation: cell 2.8s 600ms ease-in-out infinite;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.8rem;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .button {
      display: inline-flex;
      min-height: 2.7rem;
      align-items: center;
      border: 1px solid var(--ink);
      border-radius: 999px;
      padding: 0 1.05rem;
      font-size: 0.9rem;
      transition: transform 180ms ease, background 180ms ease, color 180ms ease;
    }

    .button.primary {
      background: var(--ink);
      color: var(--paper);
    }

    .button:hover {
      transform: translateY(-2px);
      background: var(--accent);
      color: var(--paper);
      border-color: var(--accent);
    }

    @keyframes turn {
      from {
        transform: translate(-50%, -50%) rotate(0deg);
      }
      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    @keyframes sweep {
      0%, 100% {
        opacity: 0.24;
        transform: translate(-50%, -50%) rotate(18deg) scaleX(0.88);
      }
      50% {
        opacity: 0.72;
        transform: translate(-50%, -50%) rotate(32deg) scaleX(1);
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes strike {
      to {
        transform: scaleX(1);
      }
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(155, 63, 47, 0.38);
      }
      70% {
        box-shadow: 0 0 0 0.8rem rgba(155, 63, 47, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(155, 63, 47, 0);
      }
    }

    @keyframes cell {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(0.94);
      }
    }

    @media (max-width: 760px) {
      body {
        overflow: auto;
      }

      main {
        min-height: auto;
        padding: 1rem;
      }

      .body {
        grid-template-columns: 1fr;
      }

      .code {
        font-size: clamp(6rem, 32vw, 9rem);
      }

      .orbit.one {
        width: 42rem;
      }

      .orbit.two {
        width: 31rem;
      }

      .orbit.three {
        width: 20rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="sky" aria-hidden="true">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
      <div class="orbit one"><span class="star">PRZ</span></div>
      <div class="orbit two"><span class="star">IDX</span></div>
      <div class="orbit three"><span class="star">404</span></div>
    </div>

    <section class="panel" aria-labelledby="title">
      <div class="mast">
        <span>The Book Prize Index</span>
        <span class="pulse">No fixed star</span>
      </div>
      <div class="body">
        <div class="code" aria-hidden="true">404</div>
        <div class="message">
          <h1 id="title">This coordinate has drifted out of the index.</h1>
          <p>
            The route exists only as a trace. Re-center on the catalog, or follow
            another line through prizes, subjects, imprints, and books.
          </p>
          <div class="mini-map" aria-hidden="true">
            <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
            <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
            <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
          </div>
          <nav class="actions" aria-label="Recovery links">
            <a class="button primary" href="/">Return home</a>
            <a class="button" href="/awards">Browse prizes</a>
            <a class="button" href="/subjects">Browse subjects</a>
          </nav>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
